name: 整合文档

on:
  push:
    branches: [master, main]
    paths:
      - 'logic skill/**/*.md'
      - 'merge_docs.py'

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行整合脚本
        run: python merge_docs.py

      - name: 提交整合文档
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "自动整合文档 [skip ci]"
          git push
